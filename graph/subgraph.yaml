specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: near
    name: factory-contract
    network: near-testnet  # or near-mainnet for production
    source:
      account: "factory-contract-2.testnet"  # Replace with your contract address
      startBlock: 187080565  # Replace with your contract deployment block
    mapping:
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Subcontract
        - Creator
      receiptHandlers:
        - handler: handleReceipt
      file: ./src/mapping.ts